[project]
name = "fracture"
version = "1.0.0"
description = "Bone fracture classification on X-rays (FracAtlas) with PyTorch, with a leakage-free evaluation protocol."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
